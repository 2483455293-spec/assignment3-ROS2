/hikrobot_camera:
  ros__parameters:
    use_sim_time: false

    camera_ip: ""
    serial_number: ""
    image_topic: "/image_raw"
    actual_frame_rate_topic: "/camera/actual_fps"
    exposure_us: 10000.0
    gain_db: 0.0
    frame_rate: 30.0
    # Supported values: BGR8, RGB8, MONO8.
    pixel_format: "BGR8"
    # Image publish reliability: "reliable" (matched by RViz2 defaults) or "best_effort".
    image_qos_reliability: "reliable"
    reconnect_period_ms: 1000
